spring:
  application:
    name: soldo

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/soldo_db}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:app_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  jackson:
    default-property-inclusion: non_null

jwt:
  secret: ${JWT_SECRET:dev-secret-change-me-in-production-at-least-32-bytes!!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

telegram:
  bot:
    secret: ${TELEGRAM_BOT_SECRET:123}
    token: ${TELEGRAM_BOT_TOKEN:123}

vk:
  client:
    id: ${VK_CLIENT_ID:}
    secret: ${VK_CLIENT_SECRET:}

yandex:
  client:
    id: ${YANDEX_CLIENT_ID:}
    secret: ${YANDEX_CLIENT_SECRET:}

server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    ru.savvy.soldo: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.security: ${LOG_LEVEL_SECURITY:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_SQL_BINDER:TRACE}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

swagger:
  username: ${SWAGGER_USERNAME:admin}
  password: ${SWAGGER_PASSWORD:admin}

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  # Базовый публичный URL приложения — используется для построения webhook URL
  # при регистрации Telegram-ботов тенантов.
  public-url: ${APP_PUBLIC_URL:http://localhost:8080}